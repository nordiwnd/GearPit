name: CI Outer Loop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Backend Regression Test (Rust)
  test-backend:
    name: Backend Regression Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gearpit
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gearpit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable # Ensures compatibility
          
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./apps/gearpit-core

      - name: Run Backend Migrations & Tests
        working-directory: ./apps/gearpit-core
        env:
          DATABASE_URL: postgres://gearpit:password@localhost:5432/gearpit_test
        run: |
          cargo install sqlx-cli --no-default-features --features postgres
          sqlx database create
          sqlx migrate run
          cargo test --all-features

  # 2. Frontend Build Check (Next.js)
  build-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './apps/gearpit-web/package-lock.json'
          
      - name: Frontend Install & Build Check
        working-directory: ./apps/gearpit-web
        run: |
          npm ci
          npm run build

  # 3. Security Scan (Trivy) - Depends on successful builds/tests
  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Core Docker Image
        run: docker build -t gearpit-core:ci-test -f apps/gearpit-core/Dockerfile .
        
      - name: Run Trivy Scan on Core
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gearpit-core:ci-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Web Docker Image
        run: docker build -t gearpit-web:ci-test -f apps/gearpit-web/Dockerfile .
        
      - name: Run Trivy Scan on Web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gearpit-web:ci-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          skip-dirs: '/usr/local/cargo/registry'