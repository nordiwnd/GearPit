name: CI Outer Loop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-scan:
    name: Build, Scan & Test
    runs-on: gearpit-runner-set
    
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gearpit
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gearpit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          
      - name: Run Backend Migrations & Tests
        working-directory: ./apps/gearpit-core
        env:
          DATABASE_URL: postgres://gearpit:password@localhost:5432/gearpit_test
        run: |
          cargo install sqlx-cli --no-default-features --features postgres
          sqlx database create
          sqlx migrate run
          cargo test --all-features

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './apps/gearpit-web/package-lock.json'
          
      - name: Frontend Install & Build Check
        working-directory: ./apps/gearpit-web
        run: |
          npm ci
          npm run build

      - name: Build Core Docker Image
        working-directory: ./apps/gearpit-core
        run: docker build -t gearpit-core:ci-test .
        
      - name: Run Trivy Scan on Core
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gearpit-core:ci-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Web Docker Image
        working-directory: ./apps/gearpit-web
        run: docker build -t gearpit-web:ci-test .
        
      - name: Run Trivy Scan on Web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gearpit-web:ci-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'