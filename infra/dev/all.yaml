apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_DB
              value: "gearpit"
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gearpit-core
  labels:
    app: gearpit-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gearpit-core
  template:
    metadata:
      labels:
        app: gearpit-core
    spec:
      containers:
        - name: gearpit-core
          image: gearpit-core
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres:5432/gearpit"
            - name: RUST_LOG
              value: "info"
---
apiVersion: v1
kind: Service
metadata:
  name: gearpit-core
spec:
  ports:
    - port: 3000
  selector:
    app: gearpit-core
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gearpit-web
  labels:
    app: gearpit-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gearpit-web
  template:
    metadata:
      labels:
        app: gearpit-web
    spec:
      containers:
        - name: gearpit-web
          image: gearpit-web
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "http://gearpit-core:3000"
---
apiVersion: v1
kind: Service
metadata:
  name: gearpit-web
spec:
  type: LoadBalancer # Expose locally
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: gearpit-web
